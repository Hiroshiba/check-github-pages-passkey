name: 固定 Cloudflare デプロイ
run-name: Cloudflare 本番デプロイ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: main からデプロイする40文字のコミット SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  validate-source:
    name: 固定 ref と入力を検証
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: production ref と入力形式を検証
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/production" ]]; then
            echo "::error::Cloudflare デプロイは production ref からだけ実行できます"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha は40文字の小文字16進数で指定してください"
            exit 1
          fi

      - name: 指定したソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: main と Worker の固定 SHA を検証
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "::error::source_sha は main から到達できるコミットではありません"
            exit 1
          fi
          if ! EXPECTED_WORKFLOW_SHA="$(jq -er '.vars.EXPECTED_WORKFLOW_SHA | select(type == "string")' wrangler.jsonc)"; then
            echo "::error::wrangler.jsonc に EXPECTED_WORKFLOW_SHA を文字列で設定してください"
            exit 1
          fi
          if [[ "$EXPECTED_WORKFLOW_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::wrangler.jsonc の EXPECTED_WORKFLOW_SHA が production の先頭コミットと一致しません"
            exit 1
          fi

  plan:
    name: Cloudflare の変更を確認
    needs: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-plan
    permissions:
      contents: read
    outputs:
      plan_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: 指定したソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: 資格情報の設定を検証
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID は32文字の小文字16進数で設定してください"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::cloudflare-plan に CLOUDFLARE_API_TOKEN を設定してください"
            exit 1
          fi
          if [[ -z "$R2_ACCESS_KEY_ID" ]]; then
            echo "::error::cloudflare-plan に R2_ACCESS_KEY_ID を設定してください"
            exit 1
          fi
          if [[ -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::cloudflare-plan に R2_SECRET_ACCESS_KEY を設定してください"
            exit 1
          fi

      - name: Terraform を準備
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Terraform backend を初期化
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -lockfile=readonly
        working-directory: terraform/cloudflare

      - name: Terraform の形式を検証
        run: terraform fmt -check -recursive
        working-directory: terraform/cloudflare

      - name: Terraform の構成を検証
        run: terraform validate -no-color
        working-directory: terraform/cloudflare

      - name: Terraform plan を作成
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=cloudflare.tfplan
        working-directory: terraform/cloudflare

      - name: Terraform plan のハッシュを記録
        id: digest
        shell: bash
        run: sha256sum cloudflare.tfplan | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"
        working-directory: terraform/cloudflare

      - name: Terraform plan を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          compression-level: 0
          if-no-files-found: error
          name: cloudflare-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: terraform/cloudflare/cloudflare.tfplan
          retention-days: 1

  apply:
    name: 確認済みの変更をデプロイ
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: cloudflare-production
    permissions:
      contents: read
    steps:
      - name: 指定したソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: 資格情報の設定を検証
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID は32文字の小文字16進数で設定してください"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::cloudflare-production に CLOUDFLARE_API_TOKEN を設定してください"
            exit 1
          fi
          if [[ -z "$R2_ACCESS_KEY_ID" ]]; then
            echo "::error::cloudflare-production に R2_ACCESS_KEY_ID を設定してください"
            exit 1
          fi
          if [[ -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::cloudflare-production に R2_SECRET_ACCESS_KEY を設定してください"
            exit 1
          fi

      - name: Terraform を準備
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Terraform backend を初期化
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -lockfile=readonly
        working-directory: terraform/cloudflare

      - name: Terraform plan を取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cloudflare-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: terraform/cloudflare

      - name: Terraform plan のハッシュを検証
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Terraform plan のハッシュが不正です"
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_PLAN_SHA256" cloudflare.tfplan | sha256sum --check --strict
        working-directory: terraform/cloudflare

      - name: pnpm を準備
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.30.2

      - name: Node.js を準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.1

      - name: 依存関係を固定状態で導入
        run: pnpm install --frozen-lockfile

      - name: デプロイ対象を静的検証
        run: pnpm run check

      - name: Terraform plan を適用
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform apply -input=false -lock-timeout=5m -auto-approve cloudflare.tfplan
        working-directory: terraform/cloudflare

      - name: Worker 設定との一致を検証
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          ACCESS_AUD="$(terraform output -raw access_aud)"
          if ! CONFIGURED_ACCESS_AUD="$(jq -er '.vars.ACCESS_AUD | select(type == "string")' ../../wrangler.jsonc)"; then
            echo "::error::wrangler.jsonc に ACCESS_AUD を文字列で設定してください"
            exit 1
          fi
          if [[ "$ACCESS_AUD" != "$CONFIGURED_ACCESS_AUD" ]]; then
            echo "::error::Terraform の access_aud と wrangler.jsonc の ACCESS_AUD が一致しません"
            exit 1
          fi
          KV_NAMESPACE_ID="$(terraform output -raw deployment_requests_kv_namespace_id)"
          if ! CONFIGURED_KV_NAMESPACE_ID="$(jq -er '.kv_namespaces[] | select(.binding == "DEPLOYMENT_REQUESTS") | .id | select(type == "string")' ../../wrangler.jsonc)"; then
            echo "::error::wrangler.jsonc に DEPLOYMENT_REQUESTS の KV namespace ID を設定してください"
            exit 1
          fi
          if [[ "$KV_NAMESPACE_ID" != "$CONFIGURED_KV_NAMESPACE_ID" ]]; then
            echo "::error::Terraform の KV namespace ID と wrangler.jsonc の binding が一致しません"
            exit 1
          fi
        working-directory: terraform/cloudflare

      - name: 承認用 Worker をデプロイ
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm wrangler deploy
