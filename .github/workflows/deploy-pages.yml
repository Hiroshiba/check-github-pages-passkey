name: 固定 GitHub Pages デプロイ
run-name: 本番デプロイ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: main から公開する40文字のコミット SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: 信頼しないソースを権限なしでビルド
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 入力形式を検証
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha は40文字の小文字16進数で指定してください"
            exit 1
          fi

      - name: 指定したソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: main に含まれるコミットか検証
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "::error::source_sha は main から到達できるコミットではありません"
            exit 1
          fi

      - name: pnpm を準備
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.30.2

      - name: Node.js を準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.1

      - name: 依存関係を固定状態で導入
        run: pnpm install --frozen-lockfile

      - name: GitHub Pages 用サイトをビルド
        env:
          VITE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: pnpm run build:site

      - name: GitHub Pages artifact を作成
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/site

  deploy:
    name: 物理セキュリティキー承認後に公開
    if: github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
